# version: '3.8'

services:
  # Service Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: go_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: ecommerce_catalog_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_catalog_db -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # Service Go Fiber API
  api:
  
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_fiber_db
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Ubah 'host=localhost' menjadi nama service postgres 'host=postgres'
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: rahasia
      DB_NAME: ecommerce_catalog_db
      DB_PORT: 5432
      JWT_SECRET: my_super_secret_key_123
      UPLOAD_DIR: /root/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      MIDTRANS_FINISH_URL: ${MIDTRANS_FINISH_URL:-http://localhost:3000/checkout/success}
      # MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      # MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - postgres
    volumes:
      - api_uploads:/root/uploads
    networks:
      - app_network
      

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  api_uploads: